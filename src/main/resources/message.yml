  money-received: '&aReceived &6${amount} &afrom the robbery.'
  economy-command-failed: '&cThe economy command could not be executed. Tell an admin.'
  reward-received: '&aBonus loot: &f{item}&a.'
  inventory-full: '&eInventory full. Bonus rewards were dropped at your feet.'
  guard-spawn: '&cBodyguards are guarding &e{name}&c!'
  guard-alert: '&cYou triggered the security guards at &e{name}&c! Escape the area to lose their attention.'
  closed-during-crack: '&cThe robbery closed before you cracked the vault.'
  participants: '&7{name}: {state}; closes or opens in {remaining}.'
