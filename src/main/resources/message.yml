  escape-pending: '&eVault cracked in &f{name}&e! Escape the robbery area to receive your money and special loot.'
  escape-actionbar: '&6Escape the robbery area to collect rewards for &e{name}&6!'
  escape-reminder: '&eYou still have unclaimed rewards from &f{name}&e. Leave the robbery region to collect them.'
  escape-success: '&aYou escaped the &e{name}&a robbery! Claiming your rewards.'
  closed: '&c&lROBBERY CLOSED! &e{name} &7will reopen in &f{minutes} minutes&7.'
