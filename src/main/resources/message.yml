# All announcements, GUI labels and status messages. & colors and SimpleRobbery placeholders supported.
prefix: '&6&lRobbery &8» &r'
errors:
  no-permission: '&cYou do not have permission.'
  players-only: '&cThis command is only available in-game.'
  unknown-command: '&cUnknown subcommand. Type &e/robbery help&c.'
  robbery-not-found: '&cRobbery &e{name} &cdoes not exist.'
  exists: '&cA robbery with that name already exists.'
  no-selection: '&cSelect two corners with /robbery wand before creating a robbery.'
  different-worlds: '&cBoth selection corners must be in the same world.'
  not-in-region: '&cThis vault must be inside the robbery region.'
  player-outside-region: '&cYou must be inside the robbery region to crack its vault.'
  invalid-number: '&cEnter a valid number within the allowed range.'
  too-far: '&cStay near the vault to keep cracking it.'
  creative: '&cRobberies cannot be completed in Creative or Spectator mode.'
  invalid-vault: '&cThis robbery has no vault blocks configured yet.'
  locked: '&cThis robbery is currently closed.'
  already-robbed: '&cYou already robbed this vault during the current opening.'
  busy: '&cYou are already cracking another vault.'
  limit: '&cThe maximum number of rewards has been reached.'
  console-only: '&cThat command is unavailable from the console.'
  no-target: '&cYou must aim at a vault block to begin cracking.'
  disabled: '&cRobbery interaction is temporarily disabled.'
  invalid-skin-name: '&cEnter a valid Mojang player name (3-16 letters, numbers or underscores).'
admin:
  help: '&e/robbery wand &7| &e/robbery create <name> &7| &e/robbery edit <name> &7| &e/robbery vault <name> &7| &e/robbery region <name> &7|
    &e/robbery start|stop <name> &7| &e/robbery delete <name> &7| &e/robbery list &7| &e/robbery reload'
  wand-given: '&aSelection wand given. Left click for position 1, right click for position 2.'
  pos1: '&aPosition 1 set: &f{x}, {y}, {z} &7({world})'
  pos2: '&aPosition 2 set: &f{x}, {y}, {z} &7({world})'
  select-region: '&eNow select the robbery region of &f{name}&e with your wand.'
  select-vault: '&eNow select the vault blocks of &f{name}&e with your wand.'
  region-saved: '&aRobbery region for &f{name}&a updated.'
  vault-saved: '&aVault area for &f{name}&a saved.'
  created: '&aCreated robbery &f{name}&a. Configure it in the GUI.'
  deleted: '&cDeleted robbery &f{name}&c.'
  cancelled: '&7Selection or chat input cancelled.'
  prompt: '&eType a new value for &f{setting}&e in chat, or type &ccancel&e.'
  saved: '&aUpdated &f{setting}&a to &f{value}&a.'
  chance-prompt: '&eEnter a chance from &f0.01 &eto &f100&e for this reward (e.g. 5.5), or &ccancel&e.'
  reward-chance: '&aUpdated reward chance to &f{chance}%&a.'
  reload: '&aConfiguration, messages, menus, and Discord settings reloaded.'
  list-line: '&e{name}&7 - {state} &7({opens_in} till next opening) &8[{world} {coords}]'
  list-region: '&7  Region: &f{world} &7[{coords}]'
  list-vault: '&7  Vault: &f{world} &7[{coords}]'
  list-empty: '&7No robberies have been created.'
  force-open: '&aForced robbery &f{name}&a to open.'
  force-close: '&cForced robbery &f{name}&c to close.'
  rewards-help: '&7Put items in the top slots. Right-click a reward to edit its chance. All item metadata is saved.'
  guard-type-updated: '&aBodyguard type is now &e{value}&a.'
  guard-skin-prompt: '&eType a Mojang player name for the bodyguard skin in chat, or &ccancel&e.'
  guard-skin-updated: '&aPlayer bodyguard skin set to &e{value}&a. The skin loads when guards spawn.'
  escape-updated: '&aRequire players to escape the region for rewards: &e{value}&a.'
  help-header: '&6&lRobbery commands &7(Page {page}/{pages})'
  help-footer: '&7Use &e/robbery help <page> &7to see more commands.'
  help-entries:
  - '&e/robbery help [page] &7- Show the command list in pages.'
  - '&e/robbery list &7- List all robberies with status, timer and location.'
  - '&e/robbery stats [player] &7- Show personal or admin-selected statistics.'
  - '&e/robbery top [type] [page] &7- Leaderboard for success, failed, attempts or money.'
  - '&e/robbery wand &7- Get the region or vault selection tool.'
  - '&e/robbery create <name> &7- Create a robbery from your wand selection.'
  - '&e/robbery edit <name> &7- Open the robbery settings menu.'
  - '&e/robbery vault <name> &7- Select vault blocks with your wand.'
  - '&e/robbery region <name> &7- Reselect the robbery boundaries.'
  - '&e/robbery start <name> &7- Force a robbery open.'
  - '&e/robbery stop <name> &7- Force a robbery closed.'
  - '&e/robbery delete <name> &7- Delete a robbery permanently.'
  - '&e/robbery reload &7- Reload all editable settings and menus.'
  - '&e/robbery cancel &7- Cancel wand selection or chat input.'
  - '&e/robbery status &7- Alias for /robbery list.'
  help-page-size: 5
  stats-line: '&e{player}&7: &a{success} successful&7, &c{failed} failed&7, &f{attempts} attempts&7, &6${earned} earned&7. Rank: &e#{rank}'
  stats-not-found: '&cNo stored player statistics found for that name.'
  top-usage: '&eUsage: /robbery top <success|failed|attempts|money> [page]'
  top-header: '&6&lRobbery Leaderboard &7({type}, page {page}/{pages})'
  top-line: '&e#{rank} &f{player} &7- &6{value}'
robbery:
  opened: '&a&lROBBERY OPEN! &e{name} &7is open for &f{minutes} minutes&7. {escape}'
